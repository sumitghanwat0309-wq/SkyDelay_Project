<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SkyDelay — Flight Delay Predictor</title>
<meta name="description" content="Predict flight delays in minutes using ML-trained insights on 610k+ flights." />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root{
    --background: oklch(0.16 0.02 250);
    --foreground: oklch(0.97 0.005 250);
    --card: oklch(0.21 0.025 255);
    --muted-foreground: oklch(0.68 0.02 255);
    --primary: oklch(0.78 0.18 165);
    --primary-foreground: oklch(0.15 0.02 250);
    --border: oklch(1 0 0 / 8%);
    --input: oklch(1 0 0 / 6%);
    --gradient-hero: radial-gradient(ellipse at top, oklch(0.3 0.1 200 / .4), transparent 60%),
                     radial-gradient(ellipse at bottom right, oklch(0.4 0.18 165 / .25), transparent 50%);
    --gradient-primary: linear-gradient(135deg, oklch(0.78 0.18 165), oklch(0.7 0.18 200));
  }
  html{font-family:'Inter',ui-sans-serif,system-ui,sans-serif}
  body{
    background-color:var(--background);
    color:var(--foreground);
    background-image:var(--gradient-hero);
    background-attachment:fixed;
    min-height:100vh;
  }
  .font-display{font-family:'Space Grotesk',sans-serif;letter-spacing:-.02em}
  .font-mono{font-family:'JetBrains Mono',ui-monospace,monospace}
  .bg-card{background-color:var(--card)}
  .bg-input{background-color:var(--input)}
  .bg-background\/60{background-color:color-mix(in oklab,var(--background) 60%,transparent)}
  .bg-card\/40{background-color:color-mix(in oklab,var(--card) 40%,transparent)}
  .bg-primary{background-color:var(--primary)}
  .bg-primary\/10{background-color:color-mix(in oklab,var(--primary) 10%,transparent)}
  .text-foreground{color:var(--foreground)}
  .text-primary-foreground{color:var(--primary-foreground)}
  .text-muted-foreground{color:var(--muted-foreground)}
  .border-border,.border-border\/60,.border-border\/40,.border-border\/50{border-color:var(--border)}
  .border-primary{border-color:var(--primary)}
  .accent-primary{accent-color:var(--primary)}
  .gradient-primary{background:var(--gradient-primary)}
  .gradient-text{background:var(--gradient-primary);-webkit-background-clip:text;background-clip:text;color:transparent}
  .result-card{background:linear-gradient(160deg, oklch(0.22 .04 200), oklch(0.18 .02 250));box-shadow:0 30px 80px -30px oklch(0 0 0 / .6)}
  .result-glow{background:radial-gradient(circle at 70% 0%, oklch(0.78 .18 165 / .4), transparent 60%)}
  select option{background:var(--card);color:var(--foreground)}
  select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in oklab,var(--primary) 20%,transparent)}
  .animate-pulse-dot{animation:pulse 2s infinite}
  @keyframes pulse{50%{opacity:.5}}
  *{border-color:var(--border)}
</style>
</head>
<body>
<div id="app" class="min-h-screen"></div>

<script>
const AIRLINES = ["United","Delta","Southwest","American","JetBlue"];
const AIRPORTS = ["ORD","LAX","DFW","MIA","JFK","SFO","BOS","SEA","ATL","DEN"];
const AIRCRAFT = ["Boeing 737","Boeing 777","Airbus A320","Airbus A350","Embraer E190"];
const REASONS = [
  {id:"Weather",label:"Weather",icon:"cloud",weight:18},
  {id:"Air Traffic Control",label:"Air Traffic",icon:"radio",weight:12},
  {id:"Maintenance",label:"Maintenance",icon:"wrench",weight:9},
  {id:"None",label:"On Schedule",icon:"clock",weight:-4},
];

const state = {
  airline:"Delta", origin:"LAX", destination:"JFK",
  aircraft:"Boeing 737", reason:"None", distance:1500, hour:14
};

function predict(s){
  const airlineW={United:6,Delta:4,Southwest:8,American:7,JetBlue:5};
  const reasonW=(REASONS.find(r=>r.id===s.reason)||{}).weight||0;
  const hub=["ORD","JFK","LAX","ATL"].includes(s.origin)?4:0;
  const rush=s.hour>=16&&s.hour<=20?7:s.hour<=5?-3:1;
  const dist=(s.distance/1000)*1.4;
  const base=2+(airlineW[s.airline]||5)+reasonW+hub+rush+dist;
  const minutes=Math.max(-15,Math.round(base));
  const confidence=Math.round(Math.min(96,Math.max(62,88-Math.abs(minutes)*.4)));
  return {minutes,confidence};
}

function status(m){
  if(m<=0) return {label:"Early / On Time",color:"oklch(0.78 0.18 165)"};
  if(m<15) return {label:"Minor Delay",color:"oklch(0.82 0.17 75)"};
  return {label:"Significant Delay",color:"oklch(0.7 0.2 25)"};
}

function selectEl(key,opts){
  return `<select data-key="${key}" class="w-full px-3.5 py-2.5 rounded-lg bg-input border border-border text-foreground text-sm transition">
    ${opts.map(o=>`<option value="${o}" ${o===state[key]?'selected':''}>${o}</option>`).join('')}
  </select>`;
}

function field(label,inner){
  return `<label class="block">
    <span class="block text-xs uppercase tracking-wider text-muted-foreground mb-2 font-mono">${label}</span>
    ${inner}
  </label>`;
}

function render(){
  const r = predict(state);
  const st = status(r.minutes);
  const destOpts = AIRPORTS.filter(a=>a!==state.origin);

  document.getElementById('app').innerHTML = `
    <header class="border-b border-border sticky top-0 z-10 bg-background/60" style="backdrop-filter:blur(20px)">
      <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl grid place-items-center gradient-primary">
            <i data-lucide="plane" class="w-5 h-5 text-primary-foreground" stroke-width="2.5"></i>
          </div>
          <div>
            <div class="font-display font-bold">SkyDelay</div>
            <div class="text-[10px] uppercase tracking-widest text-muted-foreground">ML Predictor</div>
          </div>
        </div>
        <div class="hidden sm:flex items-center gap-6 text-xs text-muted-foreground font-mono">
          <span>610,081 flights analyzed</span>
          <span class="flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse-dot"></span> Model live
          </span>
        </div>
      </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-12 lg:py-20">
      <section class="mb-16 max-w-3xl">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full border border-border text-xs font-mono text-muted-foreground mb-6">
          <i data-lucide="trending-up" class="w-3 h-3"></i> Linear regression · R² 0.84
        </div>
        <h1 class="text-5xl lg:text-7xl font-display font-bold leading-[0.95] mb-6">
          Predict your flight's
          <span class="block gradient-text">delay in seconds.</span>
        </h1>
        <p class="text-lg text-muted-foreground max-w-xl">
          Trained on 610k+ real flight records across U.S. carriers. Enter your route and we'll estimate departure delay in minutes.
        </p>
      </section>

      <section class="grid lg:grid-cols-5 gap-6">
        <div class="lg:col-span-3 rounded-2xl border border-border bg-card/40 p-6 lg:p-8" style="backdrop-filter:blur(10px)">
          <h2 class="text-sm uppercase tracking-widest text-muted-foreground mb-6 font-mono">Flight details</h2>
          <div class="grid sm:grid-cols-2 gap-5">
            ${field("Airline", selectEl("airline",AIRLINES))}
            ${field("Aircraft", selectEl("aircraft",AIRCRAFT))}
            ${field("Origin", selectEl("origin",AIRPORTS))}
            ${field("Destination", selectEl("destination",destOpts))}
            ${field(`Distance · ${state.distance} mi`,
              `<input type="range" data-key="distance" min="200" max="3500" step="50" value="${state.distance}" class="w-full accent-primary">`)}
            ${field(`Departure hour · ${String(state.hour).padStart(2,'0')}:00`,
              `<input type="range" data-key="hour" min="0" max="23" value="${state.hour}" class="w-full accent-primary">`)}
          </div>

          <div class="mt-6">
            <div class="text-xs uppercase tracking-widest text-muted-foreground mb-3 font-mono">Expected condition</div>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
              ${REASONS.map(r=>{
                const active=state.reason===r.id;
                return `<button data-reason="${r.id}" class="flex flex-col items-center gap-2 p-3 rounded-xl border transition-all ${active?'border-primary bg-primary/10 text-foreground':'border-border text-muted-foreground'}">
                  <i data-lucide="${r.icon}" class="w-4 h-4"></i>
                  <span class="text-xs">${r.label}</span>
                </button>`;
              }).join('')}
            </div>
          </div>
        </div>

        <div class="lg:col-span-2 rounded-2xl border border-border p-8 relative overflow-hidden result-card">
          <div class="absolute inset-0 result-glow pointer-events-none" style="opacity:.3"></div>
          <div class="relative">
            <div class="flex items-center justify-between mb-6">
              <span class="text-xs uppercase tracking-widest text-muted-foreground font-mono">Predicted delay</span>
              <span class="text-xs font-mono text-muted-foreground">${r.confidence}% conf.</span>
            </div>
            <div class="flex items-baseline gap-2 mb-2">
              <span class="text-7xl font-display font-bold tabular-nums">${r.minutes>0?'+':''}${r.minutes}</span>
              <span class="text-2xl text-muted-foreground font-display">min</span>
            </div>
            <div class="text-sm font-medium mb-8" style="color:${st.color}">${st.label}</div>
            <div class="space-y-3 pt-6 border-t border-border">
              ${row("Route",`<span class="flex items-center gap-1.5 font-mono">${state.origin} <i data-lucide="arrow-right" class="w-3 h-3"></i> ${state.destination}</span>`)}
              ${row("Carrier",state.airline)}
              ${row("Aircraft",state.aircraft)}
              ${row("Departure",`${String(state.hour).padStart(2,'0')}:00`)}
            </div>
          </div>
        </div>
      </section>

      <section class="grid sm:grid-cols-3 gap-4 mt-12">
        ${stat("610K+","Flights in dataset")}
        ${stat("16","Features modeled")}
        ${stat("0.84","R² score")}
      </section>
    </main>

    <footer class="border-t border-border mt-20">
      <div class="max-w-6xl mx-auto px-6 py-6 text-xs text-muted-foreground font-mono flex justify-between">
        <span>SkyDelay · scikit-learn LinearRegression</span>
        <span>© 2026</span>
      </div>
    </footer>
  `;

  // Wire events
  document.querySelectorAll('[data-key]').forEach(el=>{
    el.addEventListener('input',e=>{
      const k=e.target.dataset.key;
      const v=e.target.type==='range'?+e.target.value:e.target.value;
      state[k]=v;
      if(k==='origin' && state.destination===v) state.destination=AIRPORTS.find(a=>a!==v);
      render();
    });
  });
  document.querySelectorAll('[data-reason]').forEach(el=>{
    el.addEventListener('click',e=>{state.reason=el.dataset.reason;render();});
  });

  lucide.createIcons();
}

function row(label,value){
  return `<div class="flex items-center justify-between text-sm">
    <span class="text-muted-foreground">${label}</span>
    <span class="font-medium">${value}</span>
  </div>`;
}
function stat(value,label){
  return `<div class="rounded-xl border border-border bg-card/40 p-5" style="backdrop-filter:blur(10px)">
    <div class="text-3xl font-display font-bold">${value}</div>
    <div class="text-xs text-muted-foreground mt-1 uppercase tracking-wider font-mono">${label}</div>
  </div>`;
}

render();
</script>
</body>
</html>
